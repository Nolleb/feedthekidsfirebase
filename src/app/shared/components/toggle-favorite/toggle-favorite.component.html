<div
  class="favorite"
  [class.disabled]="!authStore.isAuthenticated()"
  [style.--favorite-color]="iconColor()"
  (click)="updateFavorite($event)"
>
  <span
    [color]="isFavorite() ? '#F16767' : iconColor()"
    [height]="iconSize()"
    [iconName]="'addFavorite'"
    [width]="iconSize()"
    class="d-flex cursor-pointer"
    appSvgIcon
  >
  </span>
</div>
